name: Build Standalone JAV Android Debug

on:
  push:
    branches:
      - feature/jav-standalone
    paths:
      - 'jav-standalone/**'
      - '.github/workflows/jav-standalone-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    name: Standalone JAV Debug APK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install standalone app dependencies
        working-directory: jav-standalone
        run: npm install --no-audit --no-fund

      - name: Typecheck and build local frontend
        working-directory: jav-standalone
        run: npm run build

      - name: Generate independent Android project
        working-directory: jav-standalone
        run: npx cap add android

      - name: Verify there is no remote site entry
        working-directory: jav-standalone
        run: |
          node -e "const c=require('./capacitor.config.json'); if(c.server?.url) process.exit(1); if(c.appId!=='uk.wort.javsearch') process.exit(2); console.log('Independent app ID, local frontend confirmed')"

      - name: Sync local JAV frontend to Android
        working-directory: jav-standalone
        run: npx cap sync android

      - name: Assemble debug
        working-directory: jav-standalone/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK
        run: |
          mkdir -p build-output
          cp jav-standalone/android/app/build/outputs/apk/debug/app-debug.apk build-output/JAV-Search-Standalone-Debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JAV-Search-Standalone-Debug
          path: build-output/JAV-Search-Standalone-Debug.apk
          retention-days: 14
          if-no-files-found: error
